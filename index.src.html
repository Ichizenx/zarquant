<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131722">
<title>Zarquant | زارکوانت</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23089981'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='38' font-weight='700' text-anchor='middle' fill='%23071a17'%3EZ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">

  <header class="topbar">
    <div class="brand">
      <div class="mark" aria-hidden="true">Z</div>
      <div class="brand-text">
        <h1>Zarquant <small>زارکوانت</small></h1>
        <p>داشبورد بازار سرمایه</p>
      </div>
    </div>
    <div class="top-actions">
      <span class="updated" id="updated">در حال بارگذاری…</span>
      <button class="icon-btn" id="refresh" type="button" aria-label="بارگذاری مجدد" title="بارگذاری مجدد">⟳</button>
    </div>
  </header>

  <main class="stage">
    <section class="summary" id="summary" aria-label="خلاصه بازار"></section>

    <section class="detail" id="detail">
      <div class="detail-top">
        <div class="detail-id">
          <span class="detail-symbol" id="dSymbol">—</span>
          <span class="detail-name" id="dName">یک نماد را از واچ‌لیست انتخاب کنید</span>
        </div>
        <span class="detail-badge" id="dBadge">—</span>
      </div>
      <div class="detail-price" id="dPrice">—</div>
      <div class="detail-grid" id="dStats"></div>
    </section>

    <section class="groups" id="groups" aria-label="خلاصه دسته‌ها"></section>

    <section class="note">
      داده‌ها از بازار TSETMC گرفته می‌شوند؛ برای دیدن جزئیات هر نماد روی آن در واچ‌لیست کلیک کنید.
    </section>
  </main>

  <aside class="watchlist" id="watchlist" aria-label="واچ‌لیست">
    <div class="wl-head">
      <span class="wl-title">واچ‌لیست</span>
      <span class="wl-count" id="wlCount"></span>
      <button class="wl-btn" id="collapseBtn" type="button" aria-label="جمع کردن واچ‌لیست" title="جمع کردن">›</button>
    </div>

    <div class="wl-search">
      <span aria-hidden="true">⌕</span>
      <input id="search" type="search" placeholder="جستجوی نماد یا نام شرکت…" autocomplete="off" spellcheck="false">
    </div>

    <div class="wl-cols" aria-hidden="true">
      <span>نماد</span><span>آخرین</span><span>تغییر</span><span>تغییر ٪</span>
    </div>

    <div class="wl-body" id="wlBody"></div>
    <p class="wl-empty" id="wlEmpty" hidden>نمادی پیدا نشد.</p>
  </aside>

  <button class="wl-open" id="openBtn" type="button" hidden aria-label="باز کردن واچ‌لیست">‹ واچ‌لیست</button>
</div>

<script src="script.js"></script>
</body>
</html>
