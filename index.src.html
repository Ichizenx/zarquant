<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131722">
<meta name="color-scheme" content="dark">
<meta name="description" content="زارکوانت — داشبورد بازار سرمایه ایران با نمودار شمعی و واچ‌لیست سبک تریدینگ‌ویو">
<title>Zarquant | زارکوانت</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23089981'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='36' font-weight='700' text-anchor='middle' fill='%23071a17'%3EZ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">

  <header class="topbar">
    <div class="brand">
      <span class="mark" aria-hidden="true">Z</span>
      <span class="brand-name">Zarquant</span>
      <span class="brand-sub">زارکوانت</span>
    </div>

    <div class="tf-tabs" role="group" aria-label="بازه زمانی نمودار">
      <button type="button" class="tf is-active" data-tf="1D" aria-pressed="true">روزانه</button>
      <button type="button" class="tf" data-tf="1W" aria-pressed="false">هفتگی</button>
      <button type="button" class="tf" data-tf="1M" aria-pressed="false">ماهانه</button>
    </div>

    <div class="top-end">
      <span class="sync" id="sync">در حال بارگذاری داده…</span>
      <button type="button" class="icon-btn" id="refresh" title="به‌روزرسانی داده" aria-label="به‌روزرسانی داده">
        <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13.2 6.2A5.4 5.4 0 1 0 13.4 9.6"/><path d="M13.4 2.6v3.8h-3.8"/>
        </svg>
      </button>
      <button type="button" class="icon-btn wl-toggle" id="wlToggle" title="واچ‌لیست" aria-label="باز کردن واچ‌لیست">
        <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M2.5 4h11M2.5 8h11M2.5 12h7"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Left drawing toolbar (fixed vertical sidebar on the chart's left edge) -->
  <aside class="draw-toolbar" id="drawToolbar" aria-label="ابزارهای رسم">
    <div class="toolbar-group">
      <button type="button" class="tb-btn is-active" data-tool="crosshair" title="خنک‌چسب" aria-label="خنک‌چسب">
        <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <line x1="8" y1="1" x2="8" y2="15"/><line x1="1" y1="8" x2="15" y2="8"/>
        </svg>
      </button>
      <button type="button" class="tb-btn" data-tool="trendline" title="خط روند" aria-label="خط روند" aria-haspopup="true" aria-controls="trendlineMenu">
        <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 14l10-10"/>
        </svg>
      </button>
      <button type="button" class="tb-btn" data-tool="fibonacci" title="فیبوناچی" aria-label="فیبوناچی">
        <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4L4 12M8 4L8 12M12 4L12 12"/>
          <path d="M4 4Q8 12 12 4" fill="none"/>
        </svg>
      </button>
      <button type="button" class="tb-btn" data-tool="brush" title="براش" aria-label="براش">
        <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 14Q4 2 8 4T14 2"/>
        </svg>
      </button>
      <button type="button" class="tb-btn" data-tool="delete" title="حذف خط" aria-label="حذف خط رسته">
        <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 9 6 9 3"/><path d="M7 3v9M5 6h6M4 3l2 3M8 3l-2 3"/>
        </svg>
      </button>
      <button type="button" class="tb-btn" data-tool="text" title="متن" aria-label="متن">
        <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 4h5M3 8h6M3 12h4"/>
        </svg>
      </button>
      <button type="button" class="tb-btn" data-tool="patterns" title="الگو‌ها" aria-label="الگو‌ها">
        <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="6" height="6" rx=".5"/><rect x="8" y="8" width="6" height="6" rx=".5"/>
        </svg>
      </button>
    </div>

    <div class="toolbar-divider"></div>

    <div class="toolbar-group">
      <button type="button" class="tb-btn" data-tool="prediction" title="پیش‌بینی" aria-label="پیش‌بینی">
        <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 14Q8 2 14 14"/>
        </svg>
      </button>
      <button type="button" class="tb-btn" data-tool="ruler" title="شاخص" aria-label="شاخص">
        <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 4h12M2 8h12M2 12h10"/><path d="M2 2v12M5 2v12M10 2v12"/>
        </svg>
      </button>
      <button type="button" class="tb-btn" data-tool="zoomin" title="بزرگ‌سازی" aria-label="بزرگ‌سازی">
        <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="8" cy="8" r="5"/><path d="M12 12l2 2M8 3v5M3 8h5"/>
        </svg>
      </button>
      <button type="button" class="tb-btn" data-tool="zoomout" title="کوچک‌سازی" aria-label="کوچک‌سازی">
        <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="8" cy="8" r="5"/><path d="M3 8h10"/>
        </svg>
      </button>
      <button type="button" class="tb-btn" data-tool="magnet" title="جذب" aria-label="جذب">
        <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 4v8a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2V4z"/><path d="M7 4v8M9 4v8"/>
        </svg>
      </button>
      <button type="button" class="tb-btn" data-tool="lock" title="قفل" aria-label="قفل">
        <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="6" width="6" height="6" rx="1"/><path d="M8 6v-2M8 14V8"/>
        </svg>
      </button>
      <button type="button" class="tb-btn" data-tool="hide" title="پنهان‌سازی" aria-label="پنهان‌سازی">
        <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 8s4-4 6 0 6 4 6 0"/><circle cx="8" cy="8" r="2"/>
        </svg>
      </button>
    </div>
  </aside>

  <!-- Trend line dropdown menu (hidden by default) -->
  <div class="dropdown-menu hidden" id="trendlineMenu" role="menu" aria-label="انواع خط روند">
    <div class="dropdown-item" data-draw="trendline" role="menuitem">
      <span>خط روند</span>
      <svg class="star" viewBox="0 0 16 16" aria-hidden="true" fill="currentColor">
        <polygon points="8,1 9.5,6.5 15,7 10,9.5 11.5,15 8,11.5 4.5,15 6,9.5 1,7 6.5,6.5"/>
      </svg>
    </div>
    <div class="dropdown-item" data-draw="trendangle" role="menuitem">
      <span>زاویه روند</span>
      <svg class="star" viewBox="0 0 16 16" aria-hidden="true" fill="currentColor">
        <polygon points="8,1 9.5,6.5 15,7 10,9.5 11.5,15 8,11.5 4.5,15 6,9.5 1,7 6.5,6.5"/>
      </svg>
    </div>
    <div class="dropdown-item" data-draw="horizline" role="menuitem">
      <span>خط افقی</span>
      <svg class="star" viewBox="0 0 16 16" aria-hidden="true" fill="currentColor">
        <polygon points="8,1 9.5,6.5 15,7 10,9.5 11.5,15 8,11.5 4.5,15 6,9.5 1,7 6.5,6.5"/>
      </svg>
    </div>
    <div class="dropdown-item" data-draw="horizray" role="menuitem">
      <span>شعه افقی</span>
      <svg class="star" viewBox="0 0 16 16" aria-hidden="true" fill="currentColor">
        <polygon points="8,1 9.5,6.5 15,7 10,9.5 11.5,15 8,11.5 4.5,15 6,9.5 1,7 6.5,6.5"/>
      </svg>
    </div>
    <div class="dropdown-item" data-draw="vertline" role="menuitem">
      <span>خط عمودی</span>
      <svg class="star" viewBox="0 0 16 16" aria-hidden="true" fill="currentColor">
        <polygon points="8,1 9.5,6.5 15,7 10,9.5 11.5,15 8,11.5 4.5,15 6,9.5 1,7 6.5,6.5"/>
      </svg>
    </div>
    <div class="dropdown-item" data-draw="arrow" role="menuitem">
      <span>فلش</span>
      <svg class="star" viewBox="0 0 16 16" aria-hidden="true" fill="currentColor">
        <polygon points="8,1 9.5,6.5 15,7 10,9.5 11.5,15 8,11.5 4.5,15 6,9.5 1,7 6.5,6.5"/>
      </svg>
    </div>
    <div class="dropdown-item" data-draw="ray" role="menuitem">
      <span>شعه</span>
      <svg class="star" viewBox="0 0 16 16" aria-hidden="true" fill="currentColor">
        <polygon points="8,1 9.5,6.5 15,7 10,9.5 11.5,15 8,11.5 4.5,15 6,9.5 1,7 6.5,6.5"/>
      </svg>
    </div>
    <div class="dropdown-item" data-draw="extendedline" role="menuitem">
      <span>خط دراز</span>
      <svg class="star" viewBox="0 0 16 16" aria-hidden="true" fill="currentColor">
        <polygon points="8,1 9.5,6.5 15,7 10,9.5 11.5,15 8,11.5 4.5,15 6,9.5 1,7 6.5,6.5"/>
      </svg>
    </div>
    <div class="dropdown-item" data-draw="parallelchannel" role="menuitem">
      <span>کانال موازی</span>
      <svg class="star" viewBox="0 0 16 16" aria-hidden="true" fill="currentColor">
        <polygon points="8,1 9.5,6.5 15,7 10,9.5 11.5,15 8,11.5 4.5,15 6,9.5 1,7 6.5,6.5"/>
      </svg>
    </div>
    <div class="dropdown-item" data-draw="flattopbottom" role="menuitem">
      <span>سقف/کف مسطح</span>
      <svg class="star" viewBox="0 0 16 16" aria-hidden="true" fill="currentColor">
        <polygon points="8,1 9.5,6.5 15,7 10,9.5 11.5,15 8,11.5 4.5,15 6,9.5 1,7 6.5,6.5"/>
      </svg>
    </div>
  </div>

  <main class="stage">
    <section class="chart" id="chartPanel" aria-label="نمودار نماد انتخاب‌شده">
      <div class="chart-head">
        <div class="chart-title">
          <div class="ct-line">
            <h2 id="cSymbol">—</h2>
            <span class="chip" id="cGroup" hidden></span>
          </div>
          <p class="ct-name" id="cName">یک نماد را از واچ‌لیست انتخاب کنید</p>
        </div>
        <div class="chart-quote">
          <span class="quote-price" id="cPrice">—</span>
          <span class="quote-delta" id="cDelta">—</span>
        </div>
      </div>

      <div class="chart-bar">
        <div class="legend" id="cLegend" aria-live="off">
          <span class="lg"><i>O</i><b id="lgO">—</b></span>
          <span class="lg"><i>H</i><b id="lgH">—</b></span>
          <span class="lg"><i>L</i><b id="lgL">—</b></span>
          <span class="lg"><i>C</i><b id="lgC">—</b></span>
          <span class="lg lg-chg" id="lgChg">—</span>
        </div>
        <div class="chart-tools">
          <div class="seg" role="group" aria-label="نوع نمودار">
            <button type="button" class="seg-btn is-active" data-mode="candles" aria-pressed="true" title="شمعی" aria-label="نمودار شمعی">
              <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
                <path d="M4.5 2.2v2.4M4.5 11.4v2.4M11.5 2.2v3.4M11.5 10.4v3.4"/>
                <rect x="3" y="4.6" width="3" height="6.8" rx=".5"/><rect x="10" y="5.6" width="3" height="4.8" rx=".5"/>
              </svg>
            </button>
            <button type="button" class="seg-btn" data-mode="line" aria-pressed="false" title="خطی" aria-label="نمودار خطی">
              <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
                <path d="M2 11.6l3.6-4 3 2.4L14 4.4"/>
              </svg>
            </button>
            <button type="button" class="seg-btn" data-mode="area" aria-pressed="false" title="سطحی" aria-label="نمودار سطحی">
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <path d="M2 11.6l3.6-4 3 2.4L14 4.4V13H2z" fill="currentColor" opacity=".22"/>
                <path d="M2 11.6l3.6-4 3 2.4L14 4.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
          <button type="button" class="icon-btn sm" id="resetView" title="بازنشانی نما" aria-label="بازنشانی نما">
            <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 8a5 5 0 1 1 1.6 3.7"/><path d="M3 2.8v3.6h3.6"/>
            </svg>
          </button>
          <button type="button" class="icon-btn sm" id="expand" title="تمام‌صفحه" aria-label="تمام‌صفحه">
            <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 2.5H2.5V6M10 2.5h3.5V6M6 13.5H2.5V10M10 13.5h3.5V10"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="chart-canvas" id="chartCanvas">
        <canvas id="candles" role="img" aria-label="نمودار قیمت شمعی"></canvas>
        <!-- Transparent drawing canvas overlay covering the chart area -->
        <canvas class="draw-canvas" id="drawCanvas" aria-hidden="true"></canvas>
        <!-- Drag handle between the price pane and the volume pane -->
        <div class="chart-resizer" id="chartResizer" aria-label="بزرگ‌سازی/کوچک‌سازی نما" role="separator"></div>
        <div class="chart-state" id="chartState" hidden>
          <span class="cs-title" id="chartStateTitle"></span>
          <span class="cs-sub" id="chartStateSub"></span>
        </div>
      </div>

      <div class="chart-stats" id="cStats"></div>
    </section>

    <section class="pulse" id="pulse" aria-label="نبض بازار"></section>
  </main>

  <aside class="watchlist" id="watchlist" aria-label="واچ‌لیست بازار">
    <div class="wl-head">
      <h2>واچ‌لیست</h2>
      <span class="wl-count" id="wlCount">—</span>
      <button type="button" class="icon-btn sm wl-close" id="wlClose" aria-label="بستن واچ‌لیست" title="بستن">
        <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M4 4l8 8M12 4l-8 8"/>
        </svg>
      </button>
    </div>

    <label class="wl-search">
      <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <circle cx="7" cy="7" r="4.2"/><path d="M10.2 10.2L13.5 13.5"/>
      </svg>
      <input id="search" type="search" placeholder="جستجوی نماد یا نام شرکت…" autocomplete="off" spellcheck="false" aria-label="جستجوی نماد">
    </label>

    <div class="wl-cols sortable-cols" aria-hidden="true">
      <span class="sort-col" data-sort="symbol">نماد <span class="sort-arrow" aria-hidden="true"></span></span>
      <span class="sort-col" data-sort="last">آخرین معاملة <span class="sort-arrow" aria-hidden="true"></span></span>
      <span class="sort-col" data-sort="close">قیمت پایانی <span class="sort-arrow" aria-hidden="true"></span></span>
      <span class="sort-col" data-sort="volume">حجم <span class="sort-arrow" aria-hidden="true"></span></span>
      <span class="sort-col" data-sort="change">تغییر % <span class="sort-arrow" aria-hidden="true"></span></span>
    </div>

    <div class="wl-body" id="wlBody"></div>
    <p class="wl-empty" id="wlEmpty" hidden>نمادی با این جستجو پیدا نشد.</p>
  </aside>

  <div class="scrim" id="scrim" hidden></div>
</div>

<script src="chart.js"></script>
<script src="script.js"></script>
</body>
</html>
