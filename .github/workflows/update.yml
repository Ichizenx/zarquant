name: Update market data

on:
  schedule:
    # 18:00 Tehran time (UTC+03:30) = 14:30 UTC
    - cron: "30 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # fetch_data.py uses only the standard library (urllib + json), so there
      # is nothing to pip install. It never hangs: hard socket timeouts and a
      # global budget are enforced inside the script.
      - name: Fetch TSETMC data
        id: fetch
        # Keep going so the site still gets re-encrypted when TSETMC is unreachable
        # from the runner; the job is failed explicitly at the end.
        continue-on-error: true
        # TSETMC rejects many non-Iranian networks; set the TSETMC_PROXY secret
        # to an HTTP proxy if the runner cannot reach cdn.tsetmc.com directly.
        env:
          HTTP_PROXY: ${{ secrets.TSETMC_PROXY }}
          HTTPS_PROXY: ${{ secrets.TSETMC_PROXY }}
        run: timeout 300 python fetch_data.py -o data.json --bars 150 --history 8

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install StatiCrypt
        run: npm install -g staticrypt@3

      # index.src.html is the plain template. StatiCrypt turns it into the
      # password-gated index.html that GitHub Pages serves. The password comes
      # from the STATICRYPT_PASSWORD secret when it is configured, and otherwise
      # falls back to the repository password below.
      - name: Encrypt index.src.html into index.html
        env:
          STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD || 'e19m_1iLL' }}
        run: |
          set -euo pipefail
          if [ -z "${STATICRYPT_PASSWORD}" ]; then
            echo "::error::No StatiCrypt password available (secret and fallback are both empty)"
            exit 1
          fi
          cp index.src.html index.html
          rm -rf .staticrypt-build
          staticrypt index.html -p "$STATICRYPT_PASSWORD" -d .staticrypt-build \
            --short --remember 30 \
            --template-title "Zarquant | زارکوانت" \
            --template-instructions "برای دیدن داشبورد، رمز عبور را وارد کنید." \
            --template-button "ورود" \
            --template-placeholder "رمز عبور" \
            --template-remember "مرا به خاطر بسپار" \
            --template-error "رمز عبور نادرست است." \
            --template-color-primary "#089981" \
            --template-color-secondary "#131722"
          cp .staticrypt-build/index.html index.html
          rm -rf .staticrypt-build
          grep -qi "staticrypt" index.html
          if grep -q "واچ‌لیست" index.html; then
            echo "::error::index.html still contains plain markup — encryption did not run"
            exit 1
          fi
          echo "index.html encrypted ($(wc -c < index.html) bytes)."

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update market data and encrypted site"
            git push
          fi

      - name: Fail when the market data refresh failed
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::TSETMC was unreachable from the runner; data.json was not refreshed (the site is still re-encrypted)."
          exit 1
