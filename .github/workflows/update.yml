name: Update market data

on:
  schedule:
    # 18:00 Tehran time (UTC+03:30) = 14:30 UTC
    - cron: "30 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # fetch_data.py uses only the standard library (urllib + json), so there
      # is nothing to pip install.
      #
      # TSETMC drops connections from most non-Iranian networks, which is why a
      # GitHub-hosted runner cannot reach it directly. `--auto-proxy` makes the
      # script race free Iranian HTTP proxies against the real endpoint and
      # continue through the first one that answers; the proxy is also reused
      # for the daily history seeds. Set the optional TSETMC_PROXY secret to pin
      # a stable (paid) proxy and skip discovery entirely.
      - name: Fetch TSETMC data
        id: fetch
        # Keep going so the site still gets re-encrypted when TSETMC is unreachable
        # from the runner; the job is failed explicitly at the end.
        continue-on-error: true
        env:
          TSETMC_PROXY: ${{ secrets.TSETMC_PROXY }}
        run: timeout 900 python fetch_data.py -o data.json --bars 150 --history 8 --auto-proxy

      - name: Copy plain index.src.html to index.html
        run: cp index.src.html index.html

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update market data and encrypted site"
            git push
          fi

      - name: Fail when the market data refresh failed
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::TSETMC was unreachable from the runner; data.json was not refreshed (the site is still re-encrypted)."
          exit 1
