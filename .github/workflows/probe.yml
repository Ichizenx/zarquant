name: Probe TSETMC reachability

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install probe dependencies
        run: pip install requests pysocks

      - name: Run probe
        continue-on-error: true
        run: python probe/probe_ci.py

      - name: Commit results
        run: |
          git config user.name "probe-bot"
          git config user.email "probe-bot@users.noreply.github.com"
          git add probe-results.json || true
          git commit -m "chore: probe results" || true
          git push
