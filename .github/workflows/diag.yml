name: Diagnose TSETMC transport

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run transport diagnosis
        continue-on-error: true
        run: python fetch_data.py -o /tmp/data.json --history 0 --auto-proxy --report diag.json

      - name: Commit diagnosis
        if: always()
        run: |
          git config user.name "diag-bot"
          git config user.email "diag-bot@users.noreply.github.com"
          git add diag.json || true
          git commit -m "chore: transport diagnosis" || true
          git push
